<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habit Tracker</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: one phone-width column (max 560px), sticky header per screen, cards stacked; overlays for menu, sheets and dialogs. Dark-first, light as an equal second theme. */
:root {
  --bg: #000000;
  --surface: #18181B;
  --surface-2: #27272A;
  --line: #27272A;
  --text: #FAFAFA;
  --muted: #A1A1AA;
  --faint: #71717A;
  --invert: #FAFAFA;
  --on-invert: #09090B;
  --on-accent: #0A0A0A;
  --scrim: rgba(0, 0, 0, 0.66);
  --sheet: #111113;
  --danger: #F87171;
  --danger-line: #7F1D1D;
  --good: #4ADE80;
  --bad: #F87171;
  --font: 'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F4F4F5; --surface: #FFFFFF; --surface-2: #E4E4E7; --line: #E4E4E7; --text: #09090B;
    --muted: #52525B; --faint: #71717A; --invert: #09090B; --on-invert: #FAFAFA;
    --scrim: rgba(9, 9, 11, 0.4); --sheet: #FFFFFF; --danger: #DC2626; --danger-line: #FECACA;
    --good: #15803D; --bad: #DC2626; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F4F4F5; --surface: #FFFFFF; --surface-2: #E4E4E7; --line: #E4E4E7; --text: #09090B;
  --muted: #52525B; --faint: #71717A; --invert: #09090B; --on-invert: #FAFAFA;
  --scrim: rgba(9, 9, 11, 0.4); --sheet: #FFFFFF; --danger: #DC2626; --danger-line: #FECACA;
  --good: #15803D; --bad: #DC2626; color-scheme: light;
}
/* The app's own theme setting wins over the viewer's default. */
html:root[data-app-theme="dark"][data-app-theme] {
  --bg: #000000; --surface: #18181B; --surface-2: #27272A; --line: #27272A; --text: #FAFAFA;
  --muted: #A1A1AA; --faint: #71717A; --invert: #FAFAFA; --on-invert: #09090B;
  --scrim: rgba(0, 0, 0, 0.66); --sheet: #111113; --danger: #F87171; --danger-line: #7F1D1D;
  --good: #4ADE80; --bad: #F87171; color-scheme: dark;
}
html:root[data-app-theme="light"][data-app-theme] {
  --bg: #F4F4F5; --surface: #FFFFFF; --surface-2: #E4E4E7; --line: #E4E4E7; --text: #09090B;
  --muted: #52525B; --faint: #71717A; --invert: #09090B; --on-invert: #FAFAFA;
  --scrim: rgba(9, 9, 11, 0.4); --sheet: #FFFFFF; --danger: #DC2626; --danger-line: #FECACA;
  --good: #15803D; --bad: #DC2626; color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body {
  margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
body.lock { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.i { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; min-height: 100vh; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; min-height: 76px; padding-block: 16px 12px;
  background: var(--bg);
}
.top .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.top .tt small { font-size: 13px; color: var(--muted); }
.top h1 { margin: 0; font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ib {
  width: 44px; height: 44px; flex: none; padding: 0; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
}
.ib.solid { background: var(--invert); color: var(--on-invert); border-color: var(--invert); }
.ib.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.ib:disabled { opacity: 0.35; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.hint { font-size: 13px; line-height: 18px; color: var(--muted); }

/* Buttons */
.btn {
  height: 52px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent;
  font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--invert); color: var(--on-invert); }
.btn.accent { background: var(--c, var(--invert)); color: var(--on-accent); }
.btn.soft { background: var(--surface); color: var(--text); border-color: var(--line); font-weight: 600; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger-line); font-weight: 600; }
.btn.dashed { background: transparent; color: var(--muted); border: 1px dashed var(--faint); font-weight: 600; height: 48px; font-size: 15px; }
.btn:disabled { opacity: 0.4; }
.btn.block { width: 100%; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; min-width: 0; }

/* Segmented control */
.seg { position: relative; display: flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.seg-ind {
  position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 9px; background: var(--invert);
  width: calc((100% - 8px - (var(--n) - 1) * 4px) / var(--n));
  transform: translateX(calc(var(--i) * (100% + 4px)));
  transition: transform .38s cubic-bezier(.3, 1.3, .4, 1);
  box-shadow: 0 4px 14px -6px rgba(0, 0, 0, .5);
}
.seg button { position: relative; z-index: 1; }
.seg button {
  flex: 1; min-width: 0; height: 40px; padding: 0 6px; border: none; border-radius: 9px; background: transparent;
  color: var(--muted); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.seg button[aria-pressed="true"] { background: transparent; color: var(--on-invert); transition: color .25s ease .05s; }
.seg button:disabled { opacity: 0.45; }

/* Inputs */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .flabel { font-size: 13px; font-weight: 500; color: var(--muted); }
.inp {
  height: 50px; padding: 0 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  color: var(--text); font-size: 16px; outline: none; width: 100%;
}
.inp:focus { border-color: var(--text); }
.inp::placeholder { color: var(--faint); }

/* Habit card */
.habit { display: flex; flex-direction: column; gap: 14px; }
.hrow { display: flex; align-items: center; gap: 12px; }
.hopen {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: none;
  background: transparent; text-align: left;
}
.hic {
  width: 44px; height: 44px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center;
  color: var(--c); background: var(--cbg);
}
.htx { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.htx b { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htx span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chk {
  width: 46px; height: 46px; flex: none; padding: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: 2px solid var(--faint); color: var(--muted);
  transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
}
.chk:active { transform: scale(0.94); }
.chk.on { background: var(--c); border-color: var(--c); color: var(--on-accent); }
.chk.slip { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.metrics { display: flex; justify-content: space-between; gap: 6px; }
.metric { display: flex; align-items: center; gap: 5px; color: var(--c); white-space: nowrap; min-width: 0; }
.metric b { font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.metric span { font-size: 12px; color: var(--muted); }
.heat { display: flex; gap: 3px; justify-content: flex-end; overflow: hidden; padding: 0; border: none; background: transparent; width: 100%; }
.hw { display: flex; flex-direction: column; gap: 3px; flex: none; }
.hc { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); }
.hc.on { background: var(--c); }
.hc.fu { background: transparent; }
.hc.pre { opacity: 0.35; }
.hc.slip { background: var(--bad); opacity: 0.6; }
.hc.td { box-shadow: inset 0 0 0 1.5px var(--text); }

.daybar { display: flex; align-items: center; gap: 12px; padding: 4px 2px 4px; }
.daybar .track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.daybar .fill { height: 100%; border-radius: 3px; background: var(--text); transition: width .3s ease; }
.daybar span { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* Empty state */
.empty { text-align: left; display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.empty h2 { margin: 0; font-size: 20px; }
.tpl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tpl button {
  display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--bg);
  border: 1px solid var(--line); text-align: left; font-size: 14px; font-weight: 600; min-height: 56px;
}
.tpl .hic { width: 32px; height: 32px; border-radius: 9px; }

/* Detail */
.hero { display: flex; align-items: center; gap: 14px; padding-block: 4px 4px; }
.hero .hic { width: 60px; height: 60px; border-radius: 16px; }
.hero h2 { margin: 0; font-size: 24px; line-height: 28px; overflow-wrap: anywhere; }
.hero p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .v { font-size: 24px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .i { color: var(--c, var(--muted)); }
.calhead { display: flex; align-items: center; justify-content: space-between; }
.calhead b { font-size: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.cal .wd { font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.cd {
  height: 42px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; padding: 0;
}
.cd span {
  width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.cd.on span { background: var(--c); color: var(--on-accent); font-weight: 700; }
.cd.slip span { box-shadow: inset 0 0 0 2px var(--bad); color: var(--bad); font-weight: 700; }
.cd.td span { outline: 2px solid var(--text); outline-offset: 1px; }
.cd:disabled span { opacity: 0.3; }

/* Edit */
.iconpick { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 4px; }
.iconpick .bigic {
  width: 84px; height: 84px; border-radius: 999px; position: relative; border: none; padding: 0;
  display: flex; align-items: center; justify-content: center; color: var(--c); background: var(--cbg);
}
.iconpick .pen {
  position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; border-radius: 999px;
  background: var(--c); color: var(--on-accent); border: 3px solid var(--bg); display: flex; align-items: center; justify-content: center;
}
.linkbtn { background: none; border: none; color: var(--c, var(--text)); font-weight: 600; font-size: 14px; min-height: 40px; padding: 0 10px; }
.colors { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.colors button { height: 40px; border-radius: 12px; border: none; padding: 0; background: var(--sw); }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.savebar {
  position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 30%);
}

/* Icon picker */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); color: var(--muted);
  border: 1px solid var(--line); font-size: 14px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--invert); color: var(--on-invert); border-color: var(--invert); }
.igrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.igrid button {
  height: 52px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.igrid button[aria-pressed="true"] { color: var(--c); background: var(--cbg); border: 2px solid var(--c); }
.searchbox { position: relative; }
.searchbox .i { position: absolute; left: 14px; top: 15px; color: var(--muted); }
.searchbox .inp { padding-left: 42px; }

/* Drawer, sheets, dialogs */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.scrim.anim { animation: fade .2s ease; }
.drawer {
  position: fixed; left: 0; top: 0; bottom: 0; width: min(304px, 84vw); z-index: 41; background: var(--sheet);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 14px calc(20px + env(safe-area-inset-bottom, 0px));
}
.drawer.anim { animation: slidein .28s cubic-bezier(.2, .8, .2, 1); }
.prof { display: flex; align-items: center; gap: 14px; padding: 6px 8px 20px; }
.avatar {
  width: 52px; height: 52px; border-radius: 999px; background: var(--surface-2); color: var(--text);
  display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex: none;
}
.prof b { font-size: 18px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prof span { font-size: 13px; color: var(--muted); }
.nav {
  height: 52px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 14px; width: 100%;
  border: none; background: transparent; color: var(--muted); font-size: 16px; font-weight: 600; text-align: left;
}
.nav[aria-current="page"] { background: var(--surface); color: var(--text); }
.drawer .foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.drawer hr { border: none; height: 1px; background: var(--line); margin: 0 0 6px; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; margin: 0 auto; max-width: 560px;
  background: var(--sheet); border: 1px solid var(--line); border-bottom: none; border-radius: 20px 20px 0 0;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px;
  max-height: 92vh; overflow-y: auto;
}
.sheet.anim { animation: rise .3s cubic-bezier(.2, .8, .2, 1); }
.sheet h2 { margin: 0; font-size: 20px; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dialog {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 42; width: min(360px, calc(100vw - 32px));
  background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
}
.dialog h2 { margin: 0; font-size: 19px; }
.dialog p { margin: 0; color: var(--muted); line-height: 1.45; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--invert); color: var(--on-invert); padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
  max-width: calc(100vw - 32px); animation: rise .2s ease; pointer-events: none;
}
@keyframes fade { from { opacity: 0; } }
@keyframes slidein { from { transform: translateX(-100%); } }
@keyframes rise { from { transform: translate(var(--tx, 0), 16px); opacity: 0; } }
.toast { --tx: -50%; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Stats */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .v { font-size: 24px; line-height: 30px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .k { font-size: 12px; color: var(--muted); line-height: 15px; }
.cardhead { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.cardhead b { font-size: 16px; }
.cardhead span { font-size: 12px; color: var(--muted); }
.bars { position: relative; height: 150px; margin-top: 10px; display: flex; align-items: flex-end; gap: 3px; padding-left: 34px; }
.bars .grid { position: absolute; left: 34px; right: 0; border-top: 1px dashed var(--line); }
.bars .gl { position: absolute; left: 0; width: 30px; white-space: nowrap; text-align: right; font-size: 10px; color: var(--faint); transform: translateY(50%); font-variant-numeric: tabular-nums; }
.bar { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.bar i { display: block; width: 100%; max-width: 26px; border-radius: 5px 5px 2px 2px; background: var(--text); min-height: 3px; }
.bar i.none { background: var(--surface-2); }
.bar.cur i { background: var(--text); }
.bar:not(.cur) i:not(.none) { opacity: 0.55; }
.barlabels { display: flex; gap: 3px; padding-left: 34px; margin-top: 6px; }
.barlabels span { flex: 1; min-width: 0; text-align: center; font-size: 10px; color: var(--faint); white-space: nowrap; overflow: visible; }
.barlabels span.cur { color: var(--text); font-weight: 700; }
.plist { display: flex; flex-direction: column; gap: 16px; }
.prow { display: flex; flex-direction: column; gap: 8px; }
.prow .top2 { display: flex; align-items: center; gap: 10px; }
.prow .hic { width: 32px; height: 32px; border-radius: 10px; }
.prow .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .sub { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ptrack { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.ptrack i { display: block; height: 100%; border-radius: 4px; background: var(--c); }
.insight { display: flex; gap: 12px; align-items: flex-start; }
.insight p { margin: 0; line-height: 1.5; }
.insight b { font-weight: 700; }
.delta { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.flat { color: var(--muted); }

/* Score */
.datenav { display: flex; align-items: center; gap: 8px; }
.datenav .mid { flex: 1; text-align: center; display: flex; flex-direction: column; }
.datenav .mid b { font-size: 16px; }
.datenav .mid span { font-size: 12px; color: var(--muted); }
.attr { display: flex; flex-direction: column; gap: 10px; }
.attr .ah { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 999px; background: var(--c); flex: none; }
.attr .ah .nm { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attr .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.attr .val small { font-size: 12px; color: var(--muted); font-weight: 500; }
.attr .ab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stars { display: flex; gap: 2px; }
.star { width: 42px; height: 42px; border: none; background: transparent; padding: 3px; position: relative; flex: none; }
.star svg { position: absolute; left: 3px; top: 3px; }
.star .clip { position: absolute; left: 3px; top: 3px; height: 36px; overflow: hidden; }
.star .clip svg { position: static; display: block; }
.attr .avg { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.sumcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sumcard .big { font-size: 40px; line-height: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sumcard .big small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); font-size: 12px; color: var(--muted); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: transparent; border: none; padding: 6px 2px; min-height: 32px; }
.legend button[aria-pressed="true"] { color: var(--text); font-weight: 600; }
.legend button.dim { opacity: 0.45; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 40px; }
.spark i { flex: 1; min-width: 2px; max-width: 10px; border-radius: 2px; background: var(--c); }
.spark i.none { background: var(--surface-2); height: 3px !important; }
.arow { display: grid; grid-template-columns: minmax(0, 1fr) 46%; align-items: center; gap: 12px; }
.arow .l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.arow .l .t { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.arow .l .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .l .v { display: flex; align-items: baseline; gap: 8px; }
.arow .l .v b { font-size: 18px; font-variant-numeric: tabular-nums; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
table.st { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.st th, table.st td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.st thead th { font-size: 12px; color: var(--muted); font-weight: 600; height: 44px; padding: 0 8px; position: sticky; top: 0; background: var(--surface); }
table.st th:first-child, table.st td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; border-right: 1px solid var(--line); }
table.st thead th:first-child { z-index: 2; }
table.st td.c { min-width: 58px; height: 40px; padding: 0 6px; }
table.st td.c.e { color: var(--faint); }
table.st td.avgc { font-weight: 700; min-width: 52px; padding: 0 8px; }
table.st tr.today td:first-child button { color: var(--text); font-weight: 700; }
table.st tr.future td { opacity: 0.35; }
table.st tfoot td { font-weight: 700; height: 44px; border-bottom: none; }
table.st tfoot tr:first-child td { border-top: 1px solid var(--line); }
table.st tfoot td:first-child { padding: 0 12px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.rowbtn { border: none; background: transparent; height: 40px; padding: 0 12px; width: 100%; text-align: left; color: var(--muted); font-size: 13px; }
.thname { display: inline-flex; align-items: center; gap: 5px; max-width: 90px; }
.thname span { overflow: hidden; text-overflow: ellipsis; }

.rank { display: flex; flex-direction: column; gap: 16px; }
.rk { display: flex; flex-direction: column; gap: 6px; }
.rk .t { display: flex; align-items: center; gap: 8px; }
.rk .t .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .t .sum { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.rk .t .sum .i { color: var(--c); }
.rk .s { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Settings */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.li {
  min-height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: transparent; border: none; border-bottom: 1px solid var(--line); text-align: left; width: 100%; font-size: 16px;
}
.li:last-child { border-bottom: none; }
.li .sub { font-size: 13px; color: var(--muted); }
.li .lt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.status { display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-size: 14px; }
.status .i { color: var(--muted); }

/* Onboarding */
.onb { min-height: 100vh; display: flex; flex-direction: column; gap: 28px; padding-block: calc(48px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
.onb .deco { display: grid; grid-template-columns: repeat(14, minmax(0, 18px)); gap: 4px; justify-content: center; }
.onb .deco i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
.onb h1 { margin: 0; font-size: 36px; line-height: 40px; letter-spacing: -0.02em; text-wrap: balance; }
.onb p { margin: 0; font-size: 16px; line-height: 24px; color: var(--muted); }
.onb .inp { height: 58px; font-size: 20px; font-weight: 600; }
.onb .end { margin-top: auto; display: flex; flex-direction: column; gap: 10px; align-items: center; }

@media (max-width: 370px) {
  .igrid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .star { width: 38px; height: 38px; }
  .star svg { width: 32px; height: 32px; }
  .star .clip { height: 32px; }
  .kpi .v, .tile .v { font-size: 21px; }
}
[hidden] { display: none !important; }

/* Pinning, long press, sort mode */
[data-hold] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.pinmark { display: inline-flex; vertical-align: -1px; margin-right: 5px; color: var(--c); }
.li:disabled { opacity: 0.4; }
.sgroup { display: flex; flex-direction: column; gap: 8px; }
.srow {
  height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 4px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); transition: transform .15s ease;
}
.srow.dragging { transition: none; position: relative; z-index: 3; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); border-color: var(--c); }
.srow .grip { width: 40px; height: 52px; display: flex; align-items: center; justify-content: center; color: var(--muted); touch-action: none; cursor: grab; flex: none; }
.srow .sname { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hic.sm { width: 32px; height: 32px; border-radius: 10px; }
.hic.big { width: 56px; height: 56px; border-radius: 16px; }

/* Swipe layout */
.swipe {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; overscroll-behavior-x: contain;
}
.swipe::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: start; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.slide .bigname { font-size: 20px; }
.heat.big .hw, .heat.big { gap: 4px; }
.heat.big .hc { width: 14px; height: 14px; border-radius: 4px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 999px; background: var(--surface-2); transition: width .2s ease, background-color .2s ease; }
.dots i.on { width: 18px; background: var(--text); }

/* Compact layout */
.crow { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.ctop { display: flex; align-items: center; gap: 10px; }
.ctop .hopen { gap: 10px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.dd {
  height: 46px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.dd small { font-size: 10px; line-height: 12px; }
.dd b { font-size: 14px; line-height: 16px; }
.dd.on { background: var(--c); border-color: var(--c); color: var(--on-accent); }
.dd.slip { border: 2px solid var(--bad); color: var(--bad); }
.dd.td { outline: 2px solid var(--text); outline-offset: 1px; }
.dd:disabled { opacity: 0.3; }
.spark { min-width: 0; overflow: hidden; }
.spark.dense { gap: 1px; }
.spark.dense i { min-width: 0; border-radius: 1px; }


/* ---------- Feel: press feedback, glow, small celebrations ---------- */
button { transition: transform .14s cubic-bezier(.2, .8, .2, 1), background-color .2s ease, border-color .2s ease, box-shadow .3s ease, color .2s ease, opacity .2s ease; }
button:active:not(:disabled) { transform: scale(.96); }
.heat:active:not(:disabled), .hopen:active:not(:disabled) { transform: none; }
.card.habit, .slide, .crow { transition: transform .2s cubic-bezier(.2, .8, .2, 1), border-color .3s ease, box-shadow .3s ease; }
.card.habit:active, .crow:active { transform: scale(.99); }
@media (hover: hover) {
  .card.habit:hover, .slide:hover, .crow:hover {
    border-color: color-mix(in srgb, var(--c) 40%, var(--line));
    box-shadow: 0 10px 34px -16px color-mix(in srgb, var(--c) 60%, transparent);
  }
  .nav:hover, .li:hover:not(:disabled), .tpl button:hover { background: var(--surface-2); }
  .ib:hover:not(:disabled) { border-color: var(--faint); }
}
.chk.on { box-shadow: 0 0 22px -6px color-mix(in srgb, var(--c) 80%, transparent); }
.btn.accent { box-shadow: 0 8px 26px -12px color-mix(in srgb, var(--c, #FFFFFF) 80%, transparent); }
.hc.on { box-shadow: 0 0 6px -2px color-mix(in srgb, var(--c) 70%, transparent); }
.dd.on { box-shadow: 0 6px 16px -10px color-mix(in srgb, var(--c) 90%, transparent); }
.daybar .fill { transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.daybar .fill.full { background: linear-gradient(90deg, #22C55E, #06B6D4); box-shadow: 0 0 14px -2px rgba(34, 197, 94, .7); }
.li:active:not(:disabled), .nav:active { background: var(--surface-2); }

main.enter, .onb.enter { animation: enter .32s cubic-bezier(.2, .8, .2, 1); }
.fx-in { animation: enter .3s cubic-bezier(.2, .8, .2, 1); }
.fx-pop { animation: pop .42s cubic-bezier(.2, .9, .3, 1.35), ring .7s ease-out; }
.fx-pop svg path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .34s .1s ease forwards; }
.fx-shake { animation: shake .42s ease; }
.fx-cell { animation: cell .55s cubic-bezier(.2, .9, .3, 1.35); }
.fx-star { animation: star .45s cubic-bezier(.2, .9, .3, 1.4); }
.fx-drop { animation: drop .45s ease; }
.fx-pill { animation: pill .3s cubic-bezier(.2, .9, .3, 1.3); }
.fx-glow { animation: glow 1.3s ease; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { 0% { transform: scale(.82); } 55% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 65%, transparent); } to { box-shadow: 0 0 0 16px transparent; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
@keyframes cell { 0% { transform: scale(.5); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes star { 0% { transform: scale(.7) rotate(-12deg); } 60% { transform: scale(1.22) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes drop { 0% { transform: scale(1.03); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); } 100% { transform: scale(1); } }
@keyframes pill { 0% { transform: scale(.9); } 100% { transform: scale(1); } }
@keyframes glow { 0% { filter: brightness(1); } 30% { filter: brightness(1.6); box-shadow: 0 0 24px 2px rgba(34, 197, 94, .8); } 100% { filter: brightness(1); } }
.dialog.anim { animation: dialogIn .26s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes dialogIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.94); } }

/* Language picker on start screens, settings switch */
.langpick { align-self: flex-end; width: 116px; margin-bottom: -12px; }
.langpick .seg button { height: 32px; font-size: 13px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; padding: 0; border-radius: 999px; border: none; background: var(--surface-2); }
.switch span { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 999px; background: var(--muted); transition: transform .25s cubic-bezier(.2, .8, .2, 1), background-color .25s ease; }
.switch[aria-checked="true"] { background: #22C55E; }
.switch[aria-checked="true"] span { transform: translateX(20px); background: #FFFFFF; }
.switch:active:not(:disabled) { transform: none; }


/* ---------- Page transitions & staggered entrance ---------- */
main.enter > *, .onb.enter > * { animation: rise-in .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--k, 0) * 45ms); }
main.enter.from-right > * { animation-name: in-right; }
main.enter.from-left > * { animation-name: in-left; }
main.enter.from-right, main.enter.from-left, main.enter.from-below, .onb.enter { animation: none; }
@keyframes rise-in { from { opacity: 0; transform: translateY(16px) scale(.985); } }
@keyframes in-right { from { opacity: 0; transform: translateX(28px); } }
@keyframes in-left { from { opacity: 0; transform: translateX(-28px); } }
.enter .heat .hw, .fx-in .heat .hw { animation: col-in .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(120ms + var(--w, 0) * 14ms); }
@keyframes col-in { from { opacity: 0; transform: translateY(6px) scaleY(.6); } }
.enter .bar i, .fx-in .bar i, .fx-in.card .bar i { animation: grow-y .7s cubic-bezier(.2, .8, .2, 1) both; transform-origin: bottom; }
.enter .spark i, .fx-in .spark i { animation: grow-y .6s cubic-bezier(.2, .8, .2, 1) both; transform-origin: bottom; }
.enter .ptrack i, .fx-in .ptrack i { animation: grow-x .8s cubic-bezier(.2, .8, .2, 1) both; transform-origin: left; }
.enter .ln, .fx-in .ln, .fx-in.chart .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-line 1.1s cubic-bezier(.3, .7, .2, 1) forwards; }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes draw-line { to { stroke-dashoffset: 0; } }
.fx-in { animation: rise-in .38s cubic-bezier(.2, .8, .2, 1) both; }

/* ---------- Press ripple ---------- */
.ripple-wrap { position: fixed; overflow: hidden; pointer-events: none; z-index: 60; transition: opacity .4s ease; }
.ripple-wrap span { position: absolute; border-radius: 50%; transform: scale(0); animation: ripple .55s cubic-bezier(.2, .8, .2, 1) forwards; }
.ripple-wrap.out { opacity: 0; }
@keyframes ripple { to { transform: scale(1); } }
.card.habit:active, .crow:active, .slide:active { transform: scale(.985); }
.btn:active:not(:disabled), .nav:active, .li:active:not(:disabled) { transform: scale(.975); }
.ib:active:not(:disabled), .chk:active, .dd:active:not(:disabled), .cd:active:not(:disabled) { transform: scale(.9); }

/* ---------- Splash: mark + loading bar, no text, under 3 s ---------- */
#splash {
  position: fixed; inset: 0; z-index: 100; background: #000; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .45s ease, transform .45s cubic-bezier(.2, .8, .2, 1);
}
#splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.sp-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 44px; }
.sp-halo {
  position: absolute; left: 50%; top: 31px; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%;
  background: conic-gradient(from 0deg, #F97316, #EAB308, #22C55E, #06B6D4, #3B82F6, #A855F7, #EC4899, #F97316);
  filter: blur(60px); opacity: 0; animation: sp-halo 2.6s ease .15s both, sp-spin 6s linear infinite;
}
@keyframes sp-halo { 0% { opacity: 0; transform: scale(.4); } 40% { opacity: .38; } 100% { opacity: .22; transform: scale(1); } }
@keyframes sp-spin { to { rotate: 360deg; } }
.sp-mark { position: relative; display: grid; grid-template-columns: repeat(3, 18px); gap: 4px; }
.sp-mark i {
  width: 18px; height: 18px; border-radius: 5px; background: var(--c);
  animation: sp-pop .55s cubic-bezier(.2, .9, .3, 1.45) calc(.12s + var(--m)) both, sp-breathe 1.4s ease-in-out calc(1.1s + var(--m) * .5) infinite;
}
@keyframes sp-pop { from { opacity: 0; transform: scale(0) rotate(-35deg); border-radius: 50%; } }
@keyframes sp-breathe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); box-shadow: 0 0 14px var(--c); } }
.sp-bar {
  position: relative; width: 168px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .09); overflow: hidden;
  animation: sp-barin .4s ease .35s both;
}
@keyframes sp-barin { from { opacity: 0; transform: scaleX(.6); } }
.sp-bar i {
  position: absolute; inset: 0; border-radius: 4px; transform-origin: left; transform: scaleX(0);
  background: linear-gradient(90deg, #F97316, #EC4899, #A855F7, #06B6D4, #22C55E);
  box-shadow: 0 0 12px rgba(236, 72, 153, .55);
  animation: sp-load 1.9s cubic-bezier(.45, 0, .2, 1) .45s forwards;
}
.sp-bar b {
  position: absolute; top: 0; bottom: 0; width: 40px; left: -40px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .75), transparent);
  animation: sp-shine 1s ease-in-out .7s 2;
}
@keyframes sp-load { 0% { transform: scaleX(0); } 30% { transform: scaleX(.38); } 48% { transform: scaleX(.46); } 78% { transform: scaleX(.86); } 100% { transform: scaleX(1); } }
@keyframes sp-shine { to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } .sp-bar i { transform: scaleX(1); } }

/* ---------- To-dos ---------- */
.ib.menu { position: relative; }
.mdot {
  position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--bad); box-shadow: 0 0 0 2px var(--surface); animation: dot-in .4s cubic-bezier(.2, .9, .3, 1.5);
}
@keyframes dot-in { from { transform: scale(0); } }
.nav .badge {
  margin-left: auto; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--bad); color: var(--on-accent);
  font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
}
.qa { display: flex; gap: 8px; align-items: center; }
.qa .inp { flex: 1; min-width: 0; }
.qa .ib { height: 50px; width: 50px; border-radius: 12px; }
.qa .ib.solid:disabled { opacity: .3; }
.chips .chip { display: inline-flex; align-items: center; gap: 8px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
.chip .dot { width: 8px; height: 8px; }
.chip.dashed { background: transparent; border-style: dashed; border-color: var(--faint); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--on-invert); }
.tsec { display: flex; flex-direction: column; gap: 8px; }
.tsec > .label { display: flex; align-items: center; gap: 8px; padding: 6px 4px 0; }
.tsec > .label em { font-style: normal; color: var(--faint); font-weight: 600; letter-spacing: 0; }
.tsec > .label.late { color: var(--bad); }
.tsec > .label.late em { color: var(--bad); opacity: .7; }
.tdone-t { background: none; border: none; min-height: 36px; text-align: left; }
.trow {
  display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 0 4px 0 6px; transition: opacity .35s ease, transform .35s cubic-bezier(.2, .8, .2, 1);
}
.trow.leaving { opacity: 0; transform: translateX(14px) scale(.98); transition-delay: .25s; }
.tchk {
  width: 44px; height: 44px; flex: none; border: none; background: transparent; padding: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: transparent; position: relative;
}
.tchk::before {
  content: ''; position: absolute; inset: 10px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 70%, var(--faint));
  transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
}
.tchk.late::before { border-color: var(--bad); }
.tchk .i { position: relative; z-index: 1; }
.tchk.on { color: var(--on-accent); }
.tchk.on::before { background: var(--c); border-color: var(--c); }
.tchk:active::before { transform: scale(.85); }
.topen {
  flex: 1; min-width: 0; min-height: 56px; padding: 9px 10px 9px 2px; border: none; background: transparent; text-align: left;
  display: flex; flex-direction: column; justify-content: center; gap: 3px; color: var(--text);
}
.ttl {
  font-size: 16px; font-weight: 500; line-height: 21px; overflow-wrap: anywhere; align-self: flex-start;
  background: linear-gradient(currentColor, currentColor) 0 58% / 0 1.5px no-repeat; transition: background-size .35s ease, color .3s ease;
}
.trow.done .ttl { background-size: 100% 1.5px; color: var(--muted); }

  const t = todayK(), quit = h.type === 'quit';
  const thisMon = addD(t, -wday(t)), startMon = addD(thisMon, -(weeks - 1) * 7);
  let heat = '';
  for (let w = 0; w < weeks; w++) {
    heat += `<div class="hw" style="--w:${w}">`;
    for (let d = 0; d < 7; d++) {
      const k = addD(startMon, w * 7 + d);
      let cls = 'hc';
      if (k > t) cls += ' fu';
      else if (hOk(h, k, t)) cls += ' on';
      else if (quit && k < h.start) cls += ' pre';
      else if (quit && h.log[k]) cls += ' slip';
      if (k === t) cls += ' td';
      heat += `<i class="${cls}"></i>`;
    }
    heat += '</div>';
  }
  return `<button class="heat${big ? ' big' : ''}" data-a="openHabit" data-id="${h.id}" tabindex="-1" aria-label="${T('Verlauf öffnen', 'Open history')}: ${esc(h.name)}">${heat}</button>`;
}

// ---------- statistics ----------
function habitPeriod(period) {
  const t = todayK();
  let from, buckets = [];
  if (period === 'year') {
    const [ty, tm] = ymd(t);
    let y = ty, m = tm - 11; if (m < 1) { m += 12; y--; }
    from = `${y}-${pad(m)}-01`;
    for (let i = 0; i < 12; i++) {
      const yy = y + Math.floor((m - 1 + i) / 12), mm = ((m - 1 + i) % 12) + 1;
      buckets.push({ id: `${yy}-${pad(mm)}`, label: MON_S[mm - 1], ok: 0, el: 0, cur: i === 11 });
    }
  } else {
    const P = Number(period);
    from = addD(t, -(P - 1));
    for (let i = 0; i < P; i++) {
      const k = addD(from, i);
      const label = P <= 7 ? WD[wday(k)] : ((P - 1 - i) % 5 === 0 ? String(ymd(k)[2]) : '');
      buckets.push({ id: k, label, ok: 0, el: 0, cur: k === t });
    }
  }
  const index = new Map(buckets.map((b, i) => [b.id, i]));
  const hs = habitList();
  const per = hs.map(h => {
    const s = hStart(h);
    let ok = 0, el = 0;
    for (let n = dnum(from > s ? from : s); n <= dnum(t); n++) {
      const k = dkey(n);
      const good = hOk(h, k, t);
      el++; if (good) ok++;
      const b = buckets[index.get(period === 'year' ? k.slice(0, 7) : k)];
      if (b) { b.el++; if (good) b.ok++; }
    }
    return { h, ok, el, rate: el ? ok / el : 0, st: hStats(h) };
  });
  const ok = per.reduce((s, p) => s + p.ok, 0), el = per.reduce((s, p) => s + p.el, 0);
  return { per, buckets, ok, el, rate: el ? ok / el : null };
}

function scorePeriodData(P) {
  const t = todayK();
  const from = addD(t, -(P - 1)), pFrom = addD(from, -P), pTo = addD(from, -1);
  const rows = attrs().map(a => {
    const cur = summarize(attrRange(a.id, from, t).map(x => x.v));
    const prev = summarize(attrRange(a.id, pFrom, pTo).map(x => x.v));
    return { a, ...cur, prevSum: prev.sum, prevAvg: prev.avg, prevN: prev.n };
  });
  let days = 0;
  for (let n = dnum(from); n <= dnum(t); n++) if (scoreDay(dkey(n))) days++;
  return { rows, days, from, t };
}
function deltaHtml(v, unit = '', dec = 0) {
  if (v == null || isNaN(v)) return '';
  const r = Math.round(v * 10 ** dec) / 10 ** dec;
  const cls = r > 0 ? 'up' : r < 0 ? 'down' : 'flat';
  const s = r > 0 ? '+' + num(r, dec) : r < 0 ? '−' + num(-r, dec) : '±0';
  return `<span class="delta ${cls}">${s}${unit}</span>`;
}
function viewStatsScore() {

    </div>

    <section class="card">
      <div class="cardhead"><b>${T('Gesammelte Sterne', 'Stars collected')}</b><span>${T(`Vergleich mit den ${P} Tagen davor`, `compared with the ${P} days before`)}</span></div>
      <div class="rank">${ranked.map((r, i) => {
        const behind = i > 0 && lead.sum > r.sum ? `<span>${T(`${fmtSum(lead.sum - r.sum)} weniger als ${esc(lead.a.name)}`, `${fmtSum(lead.sum - r.sum)} fewer than ${esc(lead.a.name)}`)}</span>` : '';
        return `<div class="rk" style="${cvars(r.a.color)}">

          <div class="ptrack"><i style="width:${r.sum / max * 100}%"></i></div>

        </div>`;
      }).join('')}</div>
    </section>`;
}

// values per bucket: daily up to 120 days, weekly averages beyond
function attrSeries(aId, P) {
  const t = todayK(), from = addD(t, -(P - 1));
  const days = attrRange(aId, from, t);
  if (P <= 120) return days.map(d => ({ k: d.k, v: d.v }));
  const out = [];
  for (let i = days.length; i > 0; i -= 7) {
    const chunk = days.slice(Math.max(0, i - 7), i);
    const s = summarize(chunk.map(c => c.v));
    out.unshift({ k: chunk[0].k, v: s.avg });
  }
  return out;
}
function lineChart(P) {
  const W = 340, H = 230, L = 26, R = 8, TOP = 10, B = 24;
  const anyA = attrs()[0];
  const n = anyA ? attrSeries(anyA.id, P).length : 1;
  const x = i => L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1));
  const y = v => TOP + (5 - v) / 5 * (H - TOP - B);
  let g = '';
  for (let v = 1; v <= 5; v++) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${v}</text>`;
  const focus = ui.focusAttr && attrs().some(a => a.id === ui.focusAttr) ? ui.focusAttr : null;
  const order = attrs().slice().sort((a, b) => (a.id === focus) - (b.id === focus));
  let keys = null;
  for (const a of order) {
    const pts = attrSeries(a.id, P);
    keys = keys || pts.map(p => p.k);
    const op = focus && a.id !== focus ? 0.15 : 1;
    let path = '', last = null;
    pts.forEach((p, i) => {
      if (p.v == null) return;
      path += (last ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1) + ' ';
      last = [x(i), y(p.v)];
    });
    if (path) g += `<path class="ln" pathLength="1" d="${path}" fill="none" stroke="${a.color}" stroke-opacity="${op}" stroke-width="${a.id === focus ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (a.id === focus) pts.forEach((p, i) => { if (p.v != null) g += `<circle cx="${x(i)}" cy="${y(p.v)}" r="2.5" fill="${a.color}"/>`; });
    if (last) g += `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${a.color}" fill-opacity="${op}" stroke="var(--surface)" stroke-width="1.5"/>`;
  }
  if (keys && keys.length) {
    const ticks = keys.length > 2 ? [0, Math.floor((keys.length - 1) / 2), keys.length - 1] : [0, keys.length - 1];
    for (const i of [...new Set(ticks)]) {
      const [, m, d] = ymd(keys[i]);
      const label = P > 120 ? `${MON_S[m - 1]}` : dayNum(d, m);
      g += `<text x="${x(i)}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === keys.length - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--faint)">${label}</text>`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Verlauf aller Attribute', 'History of all attributes')}">${g}</svg>`;
}
const PERIOD_LABEL = () => ({ 7: T('letzte 7 Tage', 'last 7 days'), 30: T('letzte 30 Tage', 'last 30 days'), 90: T('letzte 3 Monate', 'last 3 months'), 365: T('letztes Jahr, Wochenschnitt', 'last year, weekly average') });

// open tasks that need attention now: overdue or due today
const todoBadge = () => { const t = todayK(); return liveTodos().filter(x => !x.done && x.due && x.due <= t).length; };
function relDay(k) {
  const diff = dnum(k) - dnum(todayK());
  if (diff === 0) return T('Heute', 'Today');
  if (diff === 1) return T('Morgen', 'Tomorrow');
  if (diff === -1) return T('Gestern', 'Yesterday');
  if (diff > 1 && diff < 7) return WD_LONG[wday(k)];
  return fmtShort(k);
}
const fmtTime = hm => { if (LANG === 'de') return hm; const [h, m] = hm.split(':').map(Number); return ((h + 11) % 12 + 1) + ':' + pad(m) + (h < 12 ? ' AM' : ' PM'); };
function todoGroups() {
  const t = todayK(), tm = addD(t, 1);
  const f = ui.todoFilter;
  const xs = liveTodos().filter(x => f === 'all' || x.cat === f);
  const open = xs.filter(x => !x.done);
  const byDue = (a, b) => (a.due + (a.time || '99')).localeCompare(b.due + (b.time || '99')) || a.createdAt - b.createdAt;
  return {
    overdue: open.filter(x => x.due && x.due < t).sort(byDue),
    today: open.filter(x => x.due === t).sort(byDue),
    tomorrow: open.filter(x => x.due === tm).sort(byDue),
    later: open.filter(x => x.due && x.due > tm).sort(byDue),
    someday: open.filter(x => !x.due).sort((a, b) => b.createdAt - a.createdAt),
    done: xs.filter(x => x.done).sort((a, b) => b.doneAt - a.doneAt),
  };
}

// ---------- press ripple ----------
const RIPPLE_SEL = '.topen, .tchk, .btn, .seg button, .nav, .li, .chip, .tpl button, .ib, .dd, .cd, .igrid button, .chk, .hopen, .card.habit, .crow, .slide, .linkbtn, .rowbtn, .colors button, .star, .srow';
document.addEventListener('pointerdown', e => {
  if (e.button && e.button !== 0) return;
  const el = e.target.closest(RIPPLE_SEL);
  if (!el || el.disabled || el.closest('[data-drag]')) return;
  const target = el.classList.contains('hopen') ? (el.closest('.card') || el) : el;
  const r = target.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const cs = getComputedStyle(target);
  const wrap = document.createElement('div');
  wrap.className = 'ripple-wrap';
  wrap.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${cs.borderRadius}`;
  const dot = document.createElement('span');
  const size = Math.hypot(r.width, r.height) * 2;
  const tint = target.matches('.chk.on, .btn.accent, .btn.primary, .dd.on, .cd.on') ? 'rgba(255,255,255,0.35)' : `color-mix(in srgb, ${getComputedStyle(target).getPropertyValue('--c').trim() || 'var(--text)'} 22%, transparent)`;
  dot.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px;background:${tint}`;
  wrap.appendChild(dot);
  document.body.appendChild(wrap);
  const end = () => { wrap.classList.add('out'); setTimeout(() => wrap.remove(), 450); document.removeEventListener('pointerup', end); document.removeEventListener('pointercancel', end); };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  setTimeout(end, 1200);
}, { passive: true });

// ---------- long press (habit menu) and drag (sort mode) ----------
let lp = null, suppressClick = false, drag = null, lpFired = false;
function openHabitMenu(id) {
  if (!S.habits[id] || ui.habitMenu === id) return;
  ui.habitMenu = id; render();
  setTimeout(() => { const b = document.querySelector('.sheet .li'); if (b) b.focus(); }, 0);
}
const cancelLp = () => { if (lp) { clearTimeout(lp.timer); lp = null; } };
document.addEventListener('pointerdown', e => {
  const hnd = e.target.closest('[data-drag]');
  if (hnd) {
    e.preventDefault();
    const row = hnd.closest('.srow');
    const rows = [...row.parentElement.querySelectorAll('.srow')];
    const idx = rows.indexOf(row);
    drag = { row, rows, idx, target: idx, y0: e.clientY, step: row.getBoundingClientRect().height + 8 };
    row.classList.add('dragging');
    try { hnd.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    return;
  }
  const card = e.target.closest('[data-hold]');
  if (!card || (e.button && e.button !== 0)) return;
  const id = card.dataset.hold;
  lp = { x: e.clientX, y: e.clientY, timer: setTimeout(() => {
    lp = null; lpFired = true;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) { /* ignore */ }
    haptic('medium');
    openHabitMenu(id);
  }, 480) };
});
document.addEventListener('pointermove', e => {
  if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) cancelLp();
  if (!drag) return;
  const dy = e.clientY - drag.y0;
  drag.row.style.transform = `translateY(${dy}px)`;
  const t = Math.max(0, Math.min(drag.rows.length - 1, Math.round(drag.idx + dy / drag.step)));
  drag.target = t;
  drag.rows.forEach((r, i) => {
    if (r === drag.row) return;
    let sh = 0;
    if (t > drag.idx && i > drag.idx && i <= t) sh = -drag.step;
    if (t < drag.idx && i < drag.idx && i >= t) sh = drag.step;
    r.style.transform = sh ? `translateY(${sh}px)` : '';
  });
});
function endDrag() {
  cancelLp();
  if (lpFired) { lpFired = false; suppressClick = true; setTimeout(() => { suppressClick = false; }, 120); }
  if (!drag) return;
  const d = drag; drag = null;
  if (d.target === d.idx) { render(); return; }
  const ids = d.rows.map(r => r.dataset.id);
  const [m] = ids.splice(d.idx, 1);
  ids.splice(d.target, 0, m);
  if (d.row.dataset.group === 'a') {
    S.meta.attrs = ids.map(id => attrs().find(a => a.id === id)).filter(Boolean);
    touchMeta(); commit(); haptic('medium');
    fx(`.srow[data-id="${m}"]`, 'fx-drop', 500);
    return;
  }
  const list = habitList();
  const pinnedGroup = d.row.dataset.group === 'p';
  const pinned = pinnedGroup ? ids : list.filter(x => x.pinned).map(x => x.id);
  const rest = pinnedGroup ? list.filter(x => !x.pinned).map(x => x.id) : ids;
  setActiveOrder([...pinned, ...rest]);
  commit();
  haptic('medium');
  fx(`.srow[data-id="${m}"]`, 'fx-drop', 500);
}
document.addEventListener('pointerup', endDrag);

    ui.edit.name = v; const s = document.getElementById('save-habit'); if (s) s.disabled = !v.trim();
  } else if (b === 'edit.desc') ui.edit.desc = v;
  else if (b === 'edit.start') { if (isKey(v)) ui.edit.start = v; }
  else if (b === 'iconQuery') {
    ui.iconQuery = v;
    document.querySelectorAll('.chips .chip').forEach(c => c.setAttribute('aria-pressed', String(!v.trim() && c.dataset.v === ui.iconCat)));
    const g = document.getElementById('icon-grid'); if (g) g.innerHTML = iconGridHtml();
  } else if (b === 'attrEdit.name') {
    ui.attrEdit.name = v; const s = document.getElementById('save-attr'); if (s) s.disabled = !v.trim();
  } else if (b === 'qa') { ui.qa = v; const g = document.getElementById('qa-go'); if (g) g.disabled = !v.trim(); }
  else if (b === 'te.title') { ui.todoEdit.title = v; const s = document.getElementById('te-save'); if (s) s.disabled = !v.trim(); }
  else if (b === 'te.time') { ui.todoEdit.time = /^\d{2}:\d{2}$/.test(v) ? v : ''; }
  else if (b === 'catEdit.name') { ui.catEdit.name = v; const s = document.getElementById('save-cat'); if (s) s.disabled = !v.trim(); }
  else if (b === 'auth.email') { ui.auth.email = v; }
  else if (b === 'auth.pw') { ui.auth.pw = v; }
  else if (b === 'meta.name') {
    S.meta.name = v.slice(0, 40); touchMeta(); saveLocal(); scheduleSync();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'te-date' && ui.todoEdit) { ui.todoEdit.due = isKey(el.value) ? el.value : ''; ui.todoEdit.pick = !!ui.todoEdit.due; if (!ui.todoEdit.due) ui.todoEdit.time = ''; el.blur(); render(); }
  if (el.id === 'te-time' && ui.todoEdit) { ui.todoEdit.time = /^\d{2}:\d{2}$/.test(el.value) ? el.value : ''; render(); }
  if (el.id === 'set-name') {
    const v = el.value.trim();
    if (!v) { S.meta.name = S.meta.name.trim() || T('Du', 'You'); el.value = S.meta.name; }
    else S.meta.name = v;
    touchMeta(); commit({ render: false }); toast(T('Name gespeichert', 'Name saved'));
  }
  if (el.id === 'import-file' && el.files && el.files[0]) {
    const file = el.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      el.value = '';
      let parsed;
      try { parsed = JSON.parse(String(reader.result)); } catch (err) { toast(T('Die Datei ist kein gültiges Backup.', 'That file isn\'t a valid backup.')); return; }
      const raw = parsed && parsed.data ? parsed.data : parsed;
      if (!raw || !raw.meta || !Array.isArray(raw.meta.habitIds)) { toast(T('Die Datei ist kein gültiges Backup.', 'That file isn\'t a valid backup.')); return; }
      const next = normalize(raw);
      next.meta.onboarded = true;
      openConfirm({
        title: T('Backup importieren?', 'Import backup?'), text: T(`Das Backup enthält ${next.meta.habitIds.length} ${plural(next.meta.habitIds.length, 'Gewohnheit', 'Gewohnheiten')}. Deine aktuellen Daten werden dadurch ersetzt.`, `The backup contains ${next.meta.habitIds.length} ${plural(next.meta.habitIds.length, 'habit', 'habits')}. It replaces your current data.`), ok: T('Importieren', 'Import'),
        onOk: () => { replaceAll(next); setTop('habits'); toast(T('Backup importiert', 'Backup imported')); },
      });
    };
    reader.onerror = () => toast(T('Die Datei konnte nicht gelesen werden.', 'The file couldn\'t be read.'));
    reader.readAsText(file);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'onboard') actions.finishOnboarding();
  if (e.target.dataset.form === 'auth') actions.authSubmit();
  if (e.target.dataset.form === 'quickadd') actions.quickAdd();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && anyOverlay()) { actions.closeOverlay(); return; }
  if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT') {
    if (e.target.id === 'f-name' || e.target.id === 'f-desc') { e.preventDefault(); if (ui.edit && ui.edit.name.trim()) actions.saveHabit(); }
    if (e.target.id === 'attr-name') { e.preventDefault(); actions.saveAttr(); }
    if (e.target.id === 'cat-name') { e.preventDefault(); actions.saveCat(); }
    if (e.target.id === 'te-title') { e.preventDefault(); if (ui.todoEdit && ui.todoEdit.title.trim()) actions.saveTodo(); }
    if (e.target.id === 'set-name') e.target.blur();
  }
});
// a new day while the app stays open
let lastDay = todayK();
setInterval(() => { const t = todayK(); if (t !== lastDay) { lastDay = t; safeRender(); } }, 60000);

// ---------- splash ----------
function showSplash() {
  if (navigator.webdriver && !window.__SPLASH) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const palette = ['#F97316', '#EAB308', '#22C55E', '#EC4899', '#FAFAFA', '#06B6D4', '#A855F7', '#3B82F6', '#EF4444'];
  // the 3x3 mark fills in a spiral, like days on a heatmap
  const order = [0, 1, 2, 5, 8, 7, 6, 3, 4];
  const mark = palette.map((c, i) => `<i style="--c:${c};--m:${order.indexOf(i) * 65}ms"></i>`).join('');
  const el = document.createElement('div');
  el.id = 'splash';
  el.setAttribute('role', 'progressbar');
  el.setAttribute('aria-label', T('App wird geladen', 'Loading app'));
  el.innerHTML = `<div class="sp-center"><div class="sp-halo"></div><div class="sp-mark">${mark}</div><div class="sp-bar"><i></i><b></b></div></div>`;
  document.body.appendChild(el);
  document.body.classList.add('lock');
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    el.classList.add('out');
    document.body.classList.toggle('lock', anyOverlay());
    lastView = null; render();
    setTimeout(() => el.remove(), 500);
  };
  el.addEventListener('click', finish);
  // bar is full at 2.35 s, fade-out ends before 3 s
  setTimeout(finish, reduce ? 700 : 2450);
}

// ---------- boot ----------
loadLocal();
setLang(S.meta.lang || lsGet(LANG_KEY) || 'en');
if (S.meta.onboarded) ui.view = 'habits';
applyTheme();
render();
showSplash();
initCloud();
if (STANDALONE && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
